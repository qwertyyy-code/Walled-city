<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Walled City game tests</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #2b2118; }
    li { margin: 8px 0; }
    .pass { color: #2e7d32; }
    .fail { color: #b71c1c; }
    code { background: #f3ead6; padding: 2px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Game checks</h1>
  <p>These checks cover tile placement, River rules, computer moves and autoplay, watched-game saves, Home and Resume, saved-game replacement, feature completion, majority ties, meeple return, Undo, end-game scoring, and seeded bot matches.</p>
  <ol id="results"></ol>
  <p id="summary" aria-live="polite"></p>
  <script src="tiles.js"></script>
  <script src="game.js"></script>
  <script src="bot.js"></script>
  <script src="render.js"></script>
  <script>
    const results = document.getElementById("results");
    let passed = 0;
    let failed = 0;

    function assertEqual(actual, expected, message) {
      if (actual !== expected) {
        throw new Error(message + ": expected " + expected + ", got " + actual);
      }
    }

    function test(name, fn) {
      const item = document.createElement("li");
      try {
        const detail = fn();
        passed += 1;
        item.className = "pass";
        item.textContent = "PASS — " + name + (detail ? ": " + detail : "");
      } catch (error) {
        failed += 1;
        item.className = "fail";
        item.textContent = "FAIL — " + name + ": " + error.message;
      }
      results.appendChild(item);
    }

    async function testAsync(name, fn) {
      const item = document.createElement("li");
      item.textContent = "RUNNING — " + name;
      results.appendChild(item);
      try {
        const detail = await fn();
        passed += 1;
        item.className = "pass";
        item.textContent = "PASS — " + name + (detail ? ": " + detail : "");
      } catch (error) {
        failed += 1;
        item.className = "fail";
        item.textContent = "FAIL — " + name + ": " + error.message;
      }
      document.getElementById("summary").textContent =
        passed + " passed, " + failed + " failed.";
    }

    function testState() {
      const state = emptyState();
      state.players = [
        { name: "Red", color: "#c62828", meeples: 7, score: 0, endGamePoints: { roads: 0, cities: 0, monasteries: 0, farms: 0 } },
        { name: "Blue", color: "#1565c0", meeples: 7, score: 0, endGamePoints: { roads: 0, cities: 0, monasteries: 0, farms: 0 } }
      ];
      return state;
    }

    function put(state, x, y, typeId, rot, meeple) {
      state.board[keyXY(x, y)] = {
        uid: typeId + "-" + x + "-" + y,
        typeId: typeId,
        rot: rot || 0,
        meeple: meeple || null
      };
    }

    function meeple(player, kind, index) {
      return { player: player, kind: kind, index: index };
    }

    function testDrawnSpotTap(typeId, rot, kind, index) {
      const state = testState();
      if (typeId === "river-spring") {
        state.phase = "meeple";
        state.placed = { x: 0, y: 0 };
        put(state, 0, 0, typeId, rot);
        const springSpec = rotatedType(typeId, rot);
        const springFeature = springSpec.fields[index];
        const springAnchor = featureAnchor(kind, springFeature);
        const springHit = meepleSpotAt(
          meepleOptions(state),
          springSpec,
          springAnchor.x,
          springAnchor.y,
          1
        );
        assertEqual(springHit && springHit.kind, kind, "drawn " + kind + " spot resolves to " + kind);
        assertEqual(springHit && springHit.index, index, "drawn spot resolves to feature " + index);
        assertEqual(placeMeeple(state, springHit.kind, springHit.index), true, "place meeple on tapped " + kind);
        assertEqual(state.board["0,0"].meeple.kind, kind, "meeple is stored on " + kind);
        assertEqual(state.board["0,0"].meeple.index, index, "meeple feature index");
        return;
      }
      state.deck = [{ uid: "next", typeId: "B" }];
      state.phase = "place";
      state.currentTile = { uid: "tap-test", typeId: typeId, rot: rot };
      const spec = rotatedType(typeId, rot);
      if (RIVER_TILE_TYPES[typeId]) {
        const incomingEdge = spec.edges.indexOf(RIVER);
        const previousEdge = OPPOSITE[incomingEdge];
        let previousRotation = 0;
        while (rotatedType("river-spring", previousRotation).edges[previousEdge] !== RIVER) {
          previousRotation += 1;
        }
        state.riverEnabled = true;
        state.riverOpenEnd = { x: 0, y: 0, incomingEdge: incomingEdge };
        state.riverLastTurn = null;
        put(
          state,
          DIR_DELTA[incomingEdge].x,
          DIR_DELTA[incomingEdge].y,
          "river-spring",
          previousRotation
        );
      } else {
        spec.edges.forEach(function (edgeType, edge) {
          let match = null;
          Object.keys(TILE_TYPES).some(function (neighborType) {
            for (let neighborRotation = 0; neighborRotation < 4; neighborRotation++) {
              if (rotatedType(neighborType, neighborRotation).edges[OPPOSITE[edge]] === edgeType) {
                match = { typeId: neighborType, rot: neighborRotation };
                return true;
              }
            }
            return false;
          });
          if (!match) throw new Error("no matching neighbor for edge " + edge);
          put(state, DIR_DELTA[edge].x, DIR_DELTA[edge].y, match.typeId, match.rot);
        });
      }
      assertEqual(selectPending(state, 0, 0), true, "select legal pending tile");
      const feature = kind === "monastery" ? { anchor: spec.monasteryAnchor } : spec.fields[index];
      const anchor = featureAnchor(kind, feature);
      const hit = meepleSpotAt(pendingMeepleOptions(state), spec, anchor.x, anchor.y, 1);
      assertEqual(hit && hit.kind, kind, "drawn " + kind + " spot resolves to " + kind);
      assertEqual(hit && hit.index, index, "drawn spot resolves to feature " + index);
      assertEqual(selectPendingMeeple(state, hit.kind, hit.index), true, "select tapped " + kind);
      assertEqual(confirmPending(state), true, "confirm the selected spot");
      assertEqual(boardTile(state, 0, 0).meeple.kind, kind, "meeple is stored on " + kind);
      assertEqual(boardTile(state, 0, 0).meeple.index, index, "meeple feature index");
    }

    function riverAnchorPixel(typeId, rot, anchor) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 160;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      paintTile(ctx, typeId, rot, 160, false);
      return ctx.getImageData(
        Math.round(anchor.x * canvas.width),
        Math.round(anchor.y * canvas.height),
        1,
        1
      ).data;
    }

    function riverFieldAnchorIsGrass(typeId, rot, index) {
      const anchor = featureAnchor("field", rotatedType(typeId, rot).fields[index]);
      const pixel = riverAnchorPixel(typeId, rot, anchor);
      return pixel[1] > pixel[0] && pixel[1] > pixel[2];
    }

    function isGrassPixel(data, pixel) {
      const baseGrass = Math.abs(data[pixel] - 106) <= 12
        && Math.abs(data[pixel + 1] - 166) <= 12
        && Math.abs(data[pixel + 2] - 58) <= 12;
      const shadedGrass = Math.abs(data[pixel] - 101) <= 12
        && Math.abs(data[pixel + 1] - 159) <= 12
        && Math.abs(data[pixel + 2] - 55) <= 12;
      return data[pixel + 3] > 200 && (baseGrass || shadedGrass);
    }

    function grassFlood(anchor, canvas, imageData) {
      const width = canvas.width;
      const height = canvas.height;
      const startX = Math.round(anchor.x * width);
      const startY = Math.round(anchor.y * height);
      const start = startY * width + startX;
      const data = imageData.data;
      const visited = new Uint8Array(width * height);
      const queue = new Int32Array(width * height);
      let head = 0;
      let tail = 0;
      if (!isGrassPixel(data, start * 4)) return null;
      visited[start] = 1;
      queue[tail++] = start;
      while (head < tail) {
        const index = queue[head++];
        const x = index % width;
        const candidates = [
          x > 0 ? index - 1 : -1,
          x + 1 < width ? index + 1 : -1,
          index >= width ? index - width : -1,
          index + width < width * height ? index + width : -1
        ];
        candidates.forEach(function (next) {
          if (next >= 0 && !visited[next] && isGrassPixel(data, next * 4)) {
            visited[next] = 1;
            queue[tail++] = next;
          }
        });
      }
      return visited;
    }

    function grassHalfEdgePixel(slot, size) {
      const point = slotPos(slot);
      const interior = inward(point, 0.01);
      return [Math.round(interior.x * size), Math.round(interior.y * size)];
    }

    function grassRegionResults(typeId, rot) {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      paintTile(ctx, typeId, rot, size, false);
      const imageData = ctx.getImageData(0, 0, size, size);
      const spec = rotatedType(typeId, rot);
      const reachedByField = spec.fields.map(function (field) {
        const anchor = featureAnchor("field", field);
        const visited = grassFlood(anchor, canvas, imageData);
        if (!visited) return { slots: [], error: "spot is not on grass" };
        const slots = [];
        for (let slot = 0; slot < 8; slot++) {
          const point = grassHalfEdgePixel(slot, size);
          if (visited[point[1] * size + point[0]]) slots.push(slot);
        }
        return { slots: slots, visited: visited };
      });
      const fieldsWithSlots = new Set();
      reachedByField.forEach(function (entry) {
        entry.slots.forEach(function (slot) {
          fieldsWithSlots.add(slot);
        });
      });
      const mismatches = [];
      spec.fields.forEach(function (field, fieldIndex) {
        const reached = reachedByField[fieldIndex];
        const expected = field.slots.slice().sort(function (a, b) { return a - b; });
        const actual = reached.slots.slice().sort(function (a, b) { return a - b; });
        if (reached.error || JSON.stringify(actual) !== JSON.stringify(expected)) {
          mismatches.push("field " + (fieldIndex + 1) + " expected ["
            + expected.join(",") + "] got " + (reached.error || "[" + actual.join(",") + "]"));
        }
      });
      for (let slot = 0; slot < 8; slot++) {
        const point = grassHalfEdgePixel(slot, size);
        const index = point[1] * size + point[0];
        const pixel = index * 4;
        if (!isGrassPixel(imageData.data, pixel)) continue;
        if (!fieldsWithSlots.has(slot)) mismatches.push("unclaimed grass half-edge " + slot);
      }

      const components = new Uint16Array(size * size);
      let componentCount = 0;
      for (let index = 0; index < size * size; index++) {
        const pixel = index * 4;
        if (components[index] || !isGrassPixel(imageData.data, pixel)) continue;
        componentCount++;
        const componentId = componentCount;
        const queue = new Int32Array(size * size);
        let head = 0;
        let tail = 0;
        components[index] = componentId;
        queue[tail++] = index;
        while (head < tail) {
          const current = queue[head++];
          const x = current % size;
          const candidates = [
            x > 0 ? current - 1 : -1,
            x + 1 < size ? current + 1 : -1,
            current >= size ? current - size : -1,
            current + size < size * size ? current + size : -1
          ];
          candidates.forEach(function (next) {
            if (next < 0 || components[next]) return;
            if (isGrassPixel(imageData.data, next * 4)) {
              components[next] = componentId;
              queue[tail++] = next;
            }
          });
        }
      }
      if (componentCount !== spec.fields.length) {
        mismatches.push("drawn grass components " + componentCount
          + " != field spots " + spec.fields.length);
      }
      const anchoredComponents = new Set(spec.fields.map(function (field) {
        const anchor = featureAnchor("field", field);
        const x = Math.round(anchor.x * size);
        const y = Math.round(anchor.y * size);
        return components[y * size + x];
      }).filter(Boolean));
      if (anchoredComponents.size !== spec.fields.length) {
        mismatches.push("grass components with distinct field spots " + anchoredComponents.size
          + " != " + spec.fields.length);
      }
      return mismatches;
    }

    [TILE_TYPES, RIVER_TILE_TYPES].forEach(function (types) {
      Object.keys(types).forEach(function (typeId) {
        for (let rot = 0; rot < 4; rot++) {
          test(typeId + " rotation " + rot + " grass regions match field data", function () {
            const mismatches = grassRegionResults(typeId, rot);
            assertEqual(mismatches.length, 0, mismatches.join("; "));
          });
        }
      });
    });

    Object.keys(RIVER_TILE_TYPES).forEach(function (typeId) {
      for (let rot = 0; rot < 4; rot++) {
        test(typeId + " rotation " + rot + " field spots tap their own grass areas", function () {
          const state = testState();
          state.phase = "meeple";
          state.placed = { x: 0, y: 0 };
          put(state, 0, 0, typeId, rot);
          const spec = rotatedType(typeId, rot);
          const fieldOptions = meepleOptions(state).filter(function (option) {
            return option.kind === "field";
          });
          assertEqual(fieldOptions.length, spec.fields.length, "one field spot per area");
          spec.fields.forEach(function (field, index) {
            testDrawnSpotTap(typeId, rot, "field", index);
          });
          const offGrass = [];
          spec.fields.forEach(function (field, index) {
            if (!riverFieldAnchorIsGrass(typeId, rot, index)) offGrass.push(index + 1);
          });
          assertEqual(offGrass.length, 0, "field spot(s) " + offGrass.join(", ") + " are not drawn on grass");
          const spots = [];
          spec.cities.forEach(function (feature) {
            spots.push(featureAnchor("city", feature));
          });
          spec.roads.forEach(function (feature) {
            spots.push(featureAnchor("road", feature));
          });
          if (spec.monastery) spots.push(featureAnchor("monastery", { anchor: spec.monasteryAnchor }));
          spec.fields.forEach(function (feature) {
            spots.push(featureAnchor("field", feature));
          });
          const onRiver = spots.filter(function (anchor) {
            const pixel = riverAnchorPixel(typeId, rot, anchor);
            return pixel[2] > pixel[1] && pixel[2] > pixel[0];
          });
          assertEqual(onRiver.length, 0, onRiver.length + " meeple spot(s) are on the river");
          for (let i = 0; i < spots.length; i++) {
            for (let j = i + 1; j < spots.length; j++) {
              assertEqual(
                Math.hypot(spots[i].x - spots[j].x, spots[i].y - spots[j].y) < 0.22,
                false,
                "meeple spots are at least one meeple width apart"
              );
            }
          }
        });
      }
    });

    test("river-curve-road fields use their three grass regions", function () {
      const fields = RIVER_TILE_TYPES["river-curve-road"].fields.map(function (field) {
        return field.slots.slice().sort(function (a, b) { return a - b; });
      });
      assertEqual(
        JSON.stringify(fields),
        JSON.stringify([[0, 3, 4, 7], [1, 2], [5, 6]]),
        "field half-edge groups"
      );
    });

    for (let rot = 0; rot < 4; rot++) {
      test("river-curve-road rotation " + rot + " road spot is centered on the road", function () {
        const spec = rotatedType("river-curve-road", rot);
        const anchor = featureAnchor("road", spec.roads[0]);
        const pixel = riverAnchorPixel("river-curve-road", rot, anchor);
        assertEqual(
          Array.from(pixel).slice(0, 3).join(","),
          "234,215,166",
          "road spot pixel matches the road center"
        );
      });
    }

    ["A", "B"].forEach(function (typeId) {
      for (let rot = 0; rot < 4; rot++) {
        test("monastery " + typeId + " rotation " + rot + " selecting its spot and confirming claims monastery", function () {
          testDrawnSpotTap(typeId, rot, "monastery", 0);
        });
        test("monastery " + typeId + " rotation " + rot + " selecting its field spot and confirming claims field", function () {
          testDrawnSpotTap(typeId, rot, "field", 0);
        });
      }
    });

    test("all tile meeple spots are at least one marker width apart in every rotation", function () {
      Object.keys(TILE_TYPES).forEach(function (typeId) {
        for (let rot = 0; rot < 4; rot++) {
          const spec = rotatedType(typeId, rot);
          const spots = [];
          spec.cities.forEach(function (feature, index) {
            spots.push({ kind: "city", index: index, feature: feature });
          });
          spec.roads.forEach(function (feature, index) {
            spots.push({ kind: "road", index: index, feature: feature });
          });
          if (spec.monastery) spots.push({ kind: "monastery", index: 0, feature: {} });
          spec.fields.forEach(function (feature, index) {
            spots.push({ kind: "field", index: index, feature: feature });
          });
          const anchors = spots.map(function (spot) {
            return {
              kind: spot.kind,
              index: spot.index,
              point: featureAnchor(spot.kind, spot.feature)
            };
          });
          for (let i = 0; i < anchors.length; i++) {
            for (let j = i + 1; j < anchors.length; j++) {
              const distance = Math.hypot(
                anchors[i].point.x - anchors[j].point.x,
                anchors[i].point.y - anchors[j].point.y
              );
              assertEqual(
                distance < 0.22,
                false,
                typeId + " rotation " + rot + " spots " + anchors[i].kind + anchors[i].index
                  + " and " + anchors[j].kind + anchors[j].index + " overlap"
              );
            }
          }
        }
      });
    });

    function monasteryTurnState(typeId, missingX, missingY) {
      const state = testState();
      state.current = 1;
      state.phase = "handoff";
      state.deck = [
        { uid: "monastery", typeId: typeId },
        { uid: "finisher", typeId: "B" },
        { uid: "spare", typeId: "B" }
      ];
      for (let y = -1; y <= 1; y++) {
        for (let x = -1; x <= 1; x++) {
          if ((!x && !y) || (x === missingX && y === missingY)) continue;
          if (typeId === "A" && x === 1 && y === 0) put(state, x, y, "A", 1);
          else put(state, x, y, "B", 0);
        }
      }

      beginTurn(state);
      const monasteryRot = typeId === "A" ? 3 : 0;
      state.currentTile.rot = monasteryRot;
      assertEqual(selectPending(state, 0, 0), true, "place monastery tile pending");
      assertEqual(selectPendingMeeple(state, "monastery", 0), true, "select monastery meeple");
      assertEqual(confirmPending(state), true, "confirm monastery turn");
      assertEqual(state.players[1].score, 0, "monastery remains unfinished");
      assertEqual(state.players[1].meeples, 6, "meeple remains on unfinished monastery");
      return state;
    }

    function completeMonasteryOnFollowingTurn(typeId, missingX, missingY) {
      const state = monasteryTurnState(typeId, missingX, missingY);
      beginTurn(state);
      assertEqual(state.current, 0, "other player takes the next turn");
      assertEqual(selectPending(state, missingX, missingY), true, "place final surrounding tile pending");
      assertEqual(confirmPending(state), true, "confirm finishing turn");
      assertEqual(state.players[1].score, 9, "Blue receives nine monastery points");
      assertEqual(state.players[1].meeples, 7, "Blue gets monastery meeple back");
      assertEqual(state.board["0,0"].meeple, null, "meeple removed from the board");
      assertEqual(state.scoreLog.some(function (message) {
        return message.indexOf("completed monastery") !== -1;
      }), true, "monastery completion appears in turn log");
    }

    function completeNewMonasteryInHole(typeId) {
      const state = testState();
      state.current = 1;
      state.phase = "handoff";
      state.deck = [
        { uid: "monastery", typeId: typeId },
        { uid: "spare-one", typeId: "B" },
        { uid: "spare-two", typeId: "B" }
      ];
      for (let y = -1; y <= 1; y++) {
        for (let x = -1; x <= 1; x++) {
          if (!x && !y) continue;
          if (typeId === "A" && x === 1 && y === 0) put(state, x, y, "A", 1);
          else put(state, x, y, "B", 0);
        }
      }
      beginTurn(state);
      state.currentTile.rot = typeId === "A" ? 3 : 0;
      assertEqual(selectPending(state, 0, 0), true, "place monastery in surrounded hole");
      assertEqual(selectPendingMeeple(state, "monastery", 0), true, "select completed monastery");
      assertEqual(confirmPending(state), true, "confirm monastery turn");
      assertEqual(state.players[1].score, 9, "Blue receives nine monastery points");
      assertEqual(state.players[1].meeples, 7, "Blue gets monastery meeple back");
      assertEqual(state.board["0,0"].meeple, null, "meeple removed from the board");
    }

    ["A", "B"].forEach(function (typeId) {
      test("monastery " + typeId + " scores when completed by an adjacent tile on the next turn", function () {
        completeMonasteryOnFollowingTurn(typeId, 0, -1);
      });

      test("monastery " + typeId + " scores when completed by a diagonal tile on the next turn", function () {
        completeMonasteryOnFollowingTurn(typeId, 1, -1);
      });

      test("monastery " + typeId + " scores when placed into a surrounded hole", function () {
        completeNewMonasteryInHole(typeId);
      });
    });

    test("horizontal pennant city tile rejects city contact below and accepts city contacts left and right", function () {
      const state = testState();
      put(state, 0, -1, "E", 2);
      state.phase = "place";
      state.currentTile = { uid: "F-test", typeId: "F", rot: 0 };

      assertEqual(canPlaceAt(state, "F", 0, 0, 0), false, "tile cannot meet city below via field edge");
      assertEqual(placeCurrent(state, 0, 0), false, "reject invalid placement below city");

      const betweenCities = testState();
      put(betweenCities, -1, 0, "E", 1);
      put(betweenCities, 1, 0, "E", 3);
      betweenCities.phase = "place";
      betweenCities.currentTile = { uid: "F-test", typeId: "F", rot: 0 };
      assertEqual(canPlaceAt(betweenCities, "F", 0, 0, 0), true, "tile fits between city edges left and right");
      assertEqual(placeCurrent(betweenCities, 0, 0), true, "accept horizontal city connections");
    });

    test("pennant tile F draws a horizontal city strip with a field meeple spot on each side", function () {
      const spec = rotatedType("F", 0);
      const canvas = document.createElement("canvas");
      canvas.width = 220;
      canvas.height = 220;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.translate(20, 20);
      paintTile(ctx, "F", 0, 180, false);

      function pixelColor(x, y) {
        return Array.from(ctx.getImageData(x + 20, y + 20, 1, 1).data).slice(0, 3).join(",");
      }

      assertEqual(pixelColor(15, 90), "181,107,58", "city band reaches left and right");
      assertEqual(pixelColor(90, 15), "106,166,58", "top side is field, not city");

      const features = [
        { kind: "city", feature: spec.cities[0] },
        { kind: "field", feature: spec.fields[0] },
        { kind: "field", feature: spec.fields[1] }
      ];
      const spots = features.map(function (entry) {
        return { kind: entry.kind, point: featureAnchor(entry.kind, entry.feature) };
      });
      assertEqual(spots.filter(function (spot) { return spot.kind === "city"; }).length, 1, "one city spot");
      assertEqual(spots.filter(function (spot) { return spot.kind === "field"; }).length, 2, "two field spots");
      assertEqual(spots[0].point.x, 0.5, "city spot is centered");
      assertEqual(spots[1].point.y < spots[0].point.y, true, "top field spot sits above city");
      assertEqual(spots[2].point.y > spots[0].point.y, true, "bottom field spot sits below city");
    });

    test("city strip tiles F and G draw city bands on their data edges in every rotation", function () {
      ["F", "G"].forEach(function (typeId) {
        for (let rot = 0; rot < 4; rot++) {
          const spec = rotatedType(typeId, rot);
          const horizontal = spec.cities[0].edges.indexOf(E) !== -1;
          const canvas = document.createElement("canvas");
          canvas.width = 220;
          canvas.height = 220;
          const ctx = canvas.getContext("2d", { willReadFrequently: true });
          ctx.translate(20, 20);
          paintTile(ctx, typeId, rot, 180, false);
          function colorAt(x, y) {
            return Array.from(ctx.getImageData(x + 20, y + 20, 1, 1).data).slice(0, 3).join(",");
          }
          const leftColor = colorAt(15, 90);
          const topColor = colorAt(90, 15);
          assertEqual(leftColor === "181,107,58", horizontal, typeId + " left edge at rotation " + rot);

      const state = testState();

      for (let y = -1; y <= 1; y++) {

      assertEqual(selectPending(state, cells[0].x, cells[0].y), true, "place river tile pending");

      assertEqual(selectPending(state, x, y), true, "place river tile pending");

    function playFirstLegalRiverTurn(state) {
      beginTurn(state);
      assertEqual(!!RIVER_TILE_TYPES[state.currentTile.typeId], true, "draw a river tile");
      for (let rotation = 0; rotation < 4; rotation++) {
        const cells = legalCells(state, state.currentTile.typeId, rotation);
        if (!cells.length) continue;
        for (let i = 0; i < rotation; i++) rotateCurrent(state, 1);
        assertEqual(selectPending(state, cells[0].x, cells[0].y), true, "place legal river tile pending");
        assertEqual(confirmPending(state), true, "confirm river turn");
        return;
      }
      throw new Error("no legal river placement");
    }

    function runAutoplay(seed, riverEnabled) {
      const random = createSeededRandom(seed);
      setBotRandom(random);
      const state = newGame([
        { name: "Computer 1", color: "#c62828", computer: true },
        { name: "Computer 2", color: "#1565c0", computer: true }
      ], undefined, riverEnabled, random);
      let turns = 0;
      while (!state.gameOver && turns < 100) {
        beginTurn(state);
        if (state.gameOver) break;
        const move = chooseMove(state, state.current);
        assertEqual(!!move, true, "computer finds a legal placement");
        for (let i = 0; i < move.rotation; i++) rotateCurrent(state, 1);
        assertEqual(selectPending(state, move.x, move.y), true, "computer selects legal square");
        if (move.action) {
          assertEqual(selectPendingMeeple(
            state,
            move.action.spot.kind,
            move.action.spot.index
          ), true, "computer selects legal meeple spot");
        }
        assertEqual(confirmPending(state, false), true, "computer confirms through normal turn flow");
        turns += 1;
      }
      assertEqual(state.gameOver, true, "autoplay ends normally");
      assertEqual(turns < 100, true, "autoplay completes before turn limit");
      assertEqual(validateBoard(state).length, 0, "finished board validates");
      state.players.forEach(function (player) {
        assertEqual(player.meeples >= 0 && player.meeples <= 7, true, "meeple count stays in bounds");
      });
      state.players.forEach(function (player, playerIndex) {
        const loggedPoints = state.scoreHistory.filter(function (entry) {
          return entry.player === playerIndex;
        }).reduce(function (total, entry) { return total + entry.points; }, 0);
        assertEqual(loggedPoints, player.score, player.name + " scoring log matches final score");
      });
      return state;
    }

    function applyBotMove(state, move) {
      for (let i = 0; i < move.rotation; i++) rotateCurrent(state, 1);
      if (!selectPending(state, move.x, move.y)) throw new Error("bot placement was rejected");
      if (move.action && !selectPendingMeeple(
        state,
        move.action.spot.kind,
        move.action.spot.index
      )) throw new Error("bot action was rejected");
      if (!confirmPending(state, false)) throw new Error("bot confirmation was rejected");
    }

    function cityChoiceState(ownedByBot) {
      const state = testState();

    test("40 seeded smart-versus-random games report wins, scores, farmers, and speed", function () {
      let smartWins = 0;
      let smartScoreTotal = 0;
      let randomScoreTotal = 0;
      let farmerPlacements = 0;
      let smartMoveCount = 0;
      let smartMoveTime = 0;
      let slowestSmartMove = 0;

      for (let gameIndex = 0; gameIndex < 40; gameIndex++) {
        const random = createSeededRandom(gameIndex + 1);
        setBotRandom(random);
        const smartSeat = gameIndex % 2;
        const riverEnabled = gameIndex >= 20;
        const players = [
          { name: "Seat 1", color: "#c62828", computer: true },
          { name: "Seat 2", color: "#1565c0", computer: true }
        ];
        const state = newGame(players, undefined, riverEnabled, random);
        const totalTiles = state.deck.length + state.riverDeck.length;
        const seatMode = smartSeat === 0
          ? ["smart", "random"]
          : ["random", "smart"];
        let turns = 0;

        while (!state.gameOver && turns < totalTiles + 1) {
          beginTurn(state);
          if (state.gameOver) break;
          const current = state.current;
          const started = performance.now();
          const move = chooseMove(state, current, seatMode[current]);
          const elapsed = performance.now() - started;
          if (seatMode[current] === "smart") {
            smartMoveCount++;
            smartMoveTime += elapsed;
            slowestSmartMove = Math.max(slowestSmartMove, elapsed);
            if (turns < totalTiles / 2 && move.action &&
                move.action.type === "meeple" && move.action.spot.kind === "field") {
              farmerPlacements++;
            }
          }
          assertEqual(!!move, true, "both choosers find a legal move");
          applyBotMove(state, move);
          turns++;
        }

        assertEqual(state.gameOver, true, "match ends normally");
        const smartScore = state.players[smartSeat].score;
        const randomScore = state.players[1 - smartSeat].score;
        if (smartScore > randomScore) smartWins++;
        smartScoreTotal += smartScore;
        randomScoreTotal += randomScore;
      }

      const averageSmartTime = smartMoveTime / smartMoveCount;
      const report = smartWins + "/40 wins; average score smart " +
        (smartScoreTotal / 40).toFixed(1) + ", random " +
        (randomScoreTotal / 40).toFixed(1) + "; first-half farmers " +
        farmerPlacements + "; smart move average " + averageSmartTime.toFixed(2) +
        " ms, slowest " + slowestSmartMove.toFixed(2) + " ms (estimated 4×: " +
        (slowestSmartMove * 4).toFixed(2) + " ms).";
      if (smartWins < 34) throw new Error(report + " Expected at least 34 smart wins.");
      if (slowestSmartMove * 4 > 700) {
        throw new Error(report + " Estimated 4× move time exceeds 700 ms.");
      }
      return report;
    });

      const placed = { x: cell.x, y: cell.y };
      const player = state.current;
      assertEqual(confirmPending(state), true, "turn is confirmed");
      return { player: player, position: placed };
    }

    test("four-player seed 5 autoplay ends with no excess lastPlaced entries", function () {
      const random = createSeededRandom(5);

      const state = newGame(buildPlayerSetup(false, 4, 1, [], true), undefined, false, random);
      let turns = 0;
      while (!state.gameOver && turns < 100) {

        const move = chooseMove(state, state.current);
        assertEqual(!!move, true, "bot finds a legal move");
        for (let i = 0; i < move.rotation; i++) rotateCurrent(state, 1);
        assertEqual(selectPending(state, move.x, move.y), true, "bot places a tile");
        if (move.action) {
          assertEqual(selectPendingMeeple(

        assertEqual(state.lastPlaced.length <= state.players.length, true,

      }
      assertEqual(state.gameOver, true, "four-player autoplay ends");
      assertEqual(validateBoard(state).length, 0, "autoplay board validates");
    });

    function runWorkerGames(jobs) {
      if (!jobs.length) return Promise.resolve([]);
      const workerCount = Math.min(
        jobs.length,
        Math.max(1, Math.min(8, navigator.hardwareConcurrency || 4))
      );
      return new Promise(function (resolve, reject) {
        const workers = [];
        const results = new Array(jobs.length);
        let nextJob = 0;
        let completed = 0;
        let settled = false;

        function stopWorkers() {
          workers.forEach(function (worker) { worker.terminate(); });
        }

        function fail(error) {
          if (settled) return;
          settled = true;
          stopWorkers();
          reject(error);
        }

        function assign(worker) {
          if (nextJob >= jobs.length) {
            worker.terminate();
            return;
          }
          const index = nextJob++;
          worker.postMessage(Object.assign({ index: index }, jobs[index]));
        }

        for (let i = 0; i < workerCount; i++) {
          const worker = new Worker("./match-worker.js?v=36");
          workers.push(worker);
          worker.onmessage = function (event) {
            if (event.data.error) {
              fail(new Error("seed " + jobs[event.data.index].seed + ": " + event.data.error));
              return;
            }
            results[event.data.index] = event.data.result;
            completed += 1;
            if (completed === jobs.length) {
              settled = true;
              stopWorkers();
              resolve(results);
              return;
            }
            assign(worker);
          };
          worker.onerror = function (event) {
            fail(new Error("Match worker failed: " + event.message));
          };
          assign(worker);
        }
      });
    }

    async function runMatch(settingsA, settingsB, games, options) {
      if (!Number.isInteger(games) || games < 1) throw new Error("games must be a positive integer");
      const seeds = options && options.seeds ? options.seeds.slice() : null;
      if (seeds && seeds.length !== games) throw new Error("seed list length must equal games");
      const jobs = Array.from({ length: games }, function (_, index) {
        const aSeat = index % 2 === 0 ? 0 : 1;
        return {
          seed: seeds ? seeds[index] : index + 1,
          riverEnabled: index % 2 === 0,
          settingsByPlayer: aSeat === 0
            ? [settingsA, settingsB]
            : [settingsB, settingsA]
        };
      });
      const gameResults = await runWorkerGames(jobs);
      const totals = {
        winsA: 0,
        winsB: 0,
        draws: 0,
        scoreA: 0,
        scoreB: 0,
        winningMargin: 0,
        decisiveGames: 0,
        firstPlayerWins: 0,
        completedCities: 0,
        meeplesInSupply: 0,
        farmers: 0,
        noMeepleTurns: 0,
        turns: 0
      };
      gameResults.forEach(function (result, index) {
        const aSeat = index % 2 === 0 ? 0 : 1;
        const bSeat = 1 - aSeat;
        const scoreA = result.scores[aSeat];
        const scoreB = result.scores[bSeat];
        totals.scoreA += scoreA;
        totals.scoreB += scoreB;
        if (scoreA === scoreB) {
          totals.draws += 1;
        } else {
          totals.decisiveGames += 1;
          totals.winningMargin += Math.abs(scoreA - scoreB);
          if (scoreA > scoreB) totals.winsA += 1;
          else totals.winsB += 1;
          if ((scoreA > scoreB && aSeat === 0) || (scoreB > scoreA && bSeat === 0)) {
            totals.firstPlayerWins += 1;
          }
        }
        totals.completedCities += result.completedCities;
        totals.meeplesInSupply += result.meeplesInSupply.reduce(function (sum, count) {
          return sum + count;
        }, 0) / result.meeplesInSupply.length;
        totals.farmers += result.farmers.reduce(function (sum, count) {
          return sum + count;
        }, 0) / result.farmers.length;
        totals.noMeepleTurns += result.noMeepleTurns;
        totals.turns += result.turns;
      });
      return {
        games: games,
        winsA: totals.winsA,
        winsB: totals.winsB,
        draws: totals.draws,
        averageScoreA: totals.scoreA / games,
        averageScoreB: totals.scoreB / games,
        averageWinningMargin: totals.decisiveGames
          ? totals.winningMargin / totals.decisiveGames
          : 0,
        firstPlayerWins: totals.firstPlayerWins,
        averageCitiesFinishedPerGame: totals.completedCities / games,
        averageMeeplesLeftInSupplyPerBot: totals.meeplesInSupply / games,
        averageFarmersPlacedPerBot: totals.farmers / games,
        shareTurnsWithoutMeeple: totals.turns ? totals.noMeepleTurns / totals.turns : 0
      };
    }

    async function runSmartSeatGames(playerCount, games) {
      const scoresBySeat = PLAYER_COLORS.slice(0, playerCount).map(function () { return 0; });
      const results = await runWorkerGames(Array.from({ length: games }, function (_, index) {
        return {
          seed: index + 1,
          riverEnabled: index % 2 === 0,
          settingsByPlayer: PLAYER_COLORS.slice(0, playerCount).map(function () { return {}; })
        };
      }));
      results.forEach(function (result) {
        result.scores.forEach(function (score, seat) {
          scoresBySeat[seat] += score;
        });
      });
      return scoresBySeat.map(function (score) { return score / games; });
    }

    testAsync("every service-worker cache file responds with HTTP 200", async function () {
      const response = await fetch("./sw.js", { cache: "no-store" });
      assertEqual(response.status, 200, "service-worker script responds");
      const workerSource = await response.text();
      const filesMatch = workerSource.match(/const FILES = \[([\s\S]*?)\];/);
      assertEqual(!!filesMatch, true, "cache file list is declared");
      const files = Array.from(filesMatch[1].matchAll(/["']([^"']+)["']/g))
        .map(function (match) { return match[1]; });
      assertEqual(files.length > 0, true, "cache file list is not empty");
      const statuses = await Promise.all(files.map(async function (file) {
        const fileResponse = await fetch(file, { cache: "no-store" });
        return { file: file, status: fileResponse.status };
      }));
      const failures = statuses.filter(function (file) { return file.status !== 200; });
      assertEqual(failures.length, 0,
        "all cache files return 200: " + JSON.stringify(failures));
    });
